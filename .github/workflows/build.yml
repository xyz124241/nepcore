name: Build Neptun package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build NeptunCore
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Assemble server plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/plugins
          cp target/NeptunCore-*.jar release/plugins/
          cp bundled-plugins/NeptuneMessages-1.0.0.jar release/plugins/
          cp bundled-plugins/NeptuneCommandWhitelist-1.0.0.jar release/plugins/
          cp README.md INSTALLATION.md release/
          cd release
          zip -r ../Neptun-Server-Paket.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neptun-Server-Paket
          path: |
            target/NeptunCore-*.jar
            Neptun-Server-Paket.zip
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/NeptunCore-*.jar
            Neptun-Server-Paket.zip
